<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Claim Audit Tool - Tecno Group</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Corporate Palette & Typography */
        :root {
            --tecno-primary: #0A2540; /* Blu Corporate Profondo */
            --tecno-secondary: #00D084; /* Verde SustainTech */
            --tecno-bg: #F8FAFC;
            --tecno-text: #334155;
            --tecno-border: #E2E8F0;
        }

        body { 
            background-color: var(--tecno-bg); 
            font-family: 'Inter', sans-serif;
            color: var(--tecno-text);
            padding: 30px 20px; 
        }

        /* Header e Logo */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-bottom: 30px;
            border-left: 6px solid var(--tecno-primary);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .logo-container img {
            max-height: 45px;
            width: auto;
        }

        .header-titles h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--tecno-primary);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header-titles p {
            margin: 0;
            font-size: 0.85rem;
            color: #64748B;
            font-weight: 400;
        }

        .header-titles a {
            color: var(--tecno-secondary);
            text-decoration: none;
            font-weight: 600;
        }

        .header-titles a:hover {
            text-decoration: underline;
        }

        .version-badge {
            background-color: var(--tecno-bg);
            color: var(--tecno-primary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--tecno-border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .version-badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--tecno-secondary);
            border-radius: 50%;
        }

        /* Elementi UI */
        .card { 
            border: 1px solid var(--tecno-border);
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.02); 
            margin-bottom: 25px; 
            background: #ffffff;
        }

        .card-header-custom {
            background-color: transparent;
            border-bottom: 1px solid var(--tecno-border);
            padding: 20px;
            font-weight: 700;
            color: var(--tecno-primary);
            font-size: 1.1rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--tecno-primary);
        }

        .form-control, .form-select {
            border-radius: 8px;
            border-color: var(--tecno-border);
            font-size: 0.95rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--tecno-primary);
            box-shadow: 0 0 0 0.25rem rgba(10, 37, 64, 0.1);
        }

        .btn-custom-primary {
            background-color: var(--tecno-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            padding: 8px 16px;
            transition: all 0.2s;
        }

        .btn-custom-primary:hover {
            background-color: #07192b;
            color: white;
        }

        .btn-custom-secondary {
            background-color: #ffffff;
            color: var(--tecno-primary);
            border: 1px solid var(--tecno-border);
            border-radius: 8px;
            font-weight: 600;
            padding: 8px 16px;
            transition: all 0.2s;
        }

        .btn-custom-secondary:hover {
            background-color: var(--tecno-bg);
            color: var(--tecno-primary);
        }

        .btn-custom-accent {
            background-color: var(--tecno-secondary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            padding: 8px 20px;
        }

        .btn-custom-accent:hover {
            background-color: #00b372;
            color: #ffffff;
        }

        /* Tabella */
        .table {
            margin-bottom: 0;
            font-size: 0.95rem;
        }
        
        .table-dark {
            background-color: var(--tecno-primary) !important;
            --bs-table-bg: var(--tecno-primary);
            color: white;
        }
        
        .table-dark th {
            font-weight: 600;
            letter-spacing: 0.3px;
